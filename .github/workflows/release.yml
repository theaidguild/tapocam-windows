name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      version:
        description: Version to release, without the leading 'v'.
        required: true
        type: string
      skip_tests:
        description: Skip tests already run by the calling workflow.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Normalize version
        shell: pwsh
        run: |
          $version = $env:VERSION -replace '\Av', ''
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Build installer and portable ZIP
        shell: pwsh
        env:
          SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          $buildArgs = @{ Version = $env:VERSION }
          if ($env:SKIP_TESTS -eq 'true') { $buildArgs.SkipTests = $true }
          ./build.ps1 @buildArgs
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists."
          }
          # A tag left over from a failed release has no published assets; point it at the built commit.
          gh api "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha=$env:GITHUB_SHA -F force=true | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not update tag $tag." }
          }
          $options = @('--target', $env:GITHUB_SHA, '--generate-notes', '--title', $tag)
          if ($env:VERSION.Contains('-')) { $options += '--prerelease' }
          gh release create $tag "dist/TapoCam-$env:VERSION-win-x64-setup.exe" `
            "dist/TapoCam-$env:VERSION-win-x64.zip" --repo $env:GITHUB_REPOSITORY @options
          if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag." }