name: Windows Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Build installer and portable ZIP
        shell: pwsh
        run: ./build.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)
      - name: Attach installer and ZIP to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $options = @('--verify-tag', '--generate-notes')
          if ($version.Contains('-')) { $options += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME "dist/TapoCam-$version-win-x64-setup.exe" `
            "dist/TapoCam-$version-win-x64.zip" @options
