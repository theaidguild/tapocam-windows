name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Build solution
        run: dotnet build TapoCam.sln --configuration Release
      - name: Test solution (Core and App)
        run: dotnet test TapoCam.sln --configuration Release --no-build

  release-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Check whether this version is already released
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (& dotnet msbuild src/TapoCam.App/TapoCam.App.csproj '-nologo' '-getProperty:Version' '-p:Configuration=Release').Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read the project version.'
          }
          if ($version -cnotmatch '\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?\z') {
            throw "Invalid project version '$version'; expected X.Y.Z or X.Y.Z-prerelease."
          }
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          $needed = if ($LASTEXITCODE -eq 0) { 'false' } else { 'true' }
          if ($needed -eq 'false') { Write-Host "Release v$version already exists; nothing to publish." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "needed=$needed" >> $env:GITHUB_OUTPUT

  release:
    needs: release-version
    if: needs.release-version.outputs.needed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-version.outputs.version }}