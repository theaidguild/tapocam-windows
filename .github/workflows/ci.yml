name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Serialize main pushes so two runs never compute the same release version.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Build solution
        run: dotnet build TapoCam.sln --configuration Release
      - name: Test solution (Core and App)
        run: dotnet test TapoCam.sln --configuration Release --no-build

  release-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Determine next release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prefix = (& dotnet msbuild src/TapoCam.App/TapoCam.App.csproj '-nologo' '-getProperty:VersionPrefix').Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read the project version.'
          }
          if ($prefix -cnotmatch '\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z') {
            throw "Invalid VersionPrefix '$prefix'; expected X.Y.Z."
          }
          $base = [version]$prefix
          $tags = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases.' }
          $latest = $tags |
            Where-Object { $_ -cmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z' } |
            ForEach-Object { [version]$_.Substring(1) } |
            Sort-Object -Descending |
            Select-Object -First 1
          $next = if (-not $latest -or $base -gt $latest) {
            $base
          } else {
            [version]::new($latest.Major, $latest.Minor, $latest.Build + 1)
          }
          Write-Host "Latest release: $(if ($latest) { "v$latest" } else { 'none' }); publishing v$next."
          "version=$next" >> $env:GITHUB_OUTPUT

  release:
    needs: release-version
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-version.outputs.version }}
      skip_tests: true